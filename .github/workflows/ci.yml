name: Verify

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Permite disparar a instalação limpa à mão antes de instalar num cliente.
  workflow_dispatch:

jobs:
  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax check scripts
        run: |
          bash -n scripts/*.sh

      - name: Testes do instalador (arquivo de respostas, falha alta)
        run: bash scripts/tests/test-instalador.sh

  infra-estatica:
    name: infraestrutura (checks estaticos)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Estes checks pegam as CLASSES de defeito que quebraram a primeira
      # instalacao de cliente e eram invisiveis na maquina de desenvolvimento:
      # porta ligada duas vezes, servico exposto em 0.0.0.0 por tras do nginx,
      # compose que so e valido com a Central, tabela sem migracao.
      - name: Checks estaticos de infraestrutura
        run: bash scripts/tests/test-compose-estatico.sh

      # E este prova que os checks acima REALMENTE enxergam: injeta cada
      # defeito de volta e exige reprovacao. Check verde que nao enxerga nada
      # e pior do que nenhum check.
      - name: Os checks enxergam mesmo o defeito?
        run: bash scripts/tests/test-checks-pegam-defeito.sh

  python-tests:
    name: ai-service python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Instala a stack ML COMPLETA (versões pinadas do serviço). Instalar só
      # opencv+numpy deixava supervision/onnxruntime/requests de fora, então os
      # testes de object_detector (tracker ByteTrack, item 2.5) e de logging do
      # stream ficavam `skipped` e o unittest reportava OK — exatamente o
      # falso-verde que o item 0.3 se propôs a matar.
      - name: Install ai-service test deps (stack ML pinada)
        run: |
          pip install "$(grep -E '^opencv-python-headless==' services/ai-service-python/requirements.txt)" \
                      "$(grep -E '^numpy==' services/ai-service-python/requirements.txt)" \
                      "$(grep -E '^requests==' services/ai-service-python/requirements.txt)" \
                      "$(grep -E '^onnxruntime==' services/ai-service-python/requirements.txt)" \
                      "$(grep -E '^supervision==' services/ai-service-python/requirements.txt)"

      # Dentes do gate: se qualquer dependência da stack faltar, os testes que
      # dependem dela se auto-pulam e o job passaria VERDE sem cobrir nada.
      # Aqui o job FALHA em vez de mascarar.
      - name: Exigir a stack ML presente (sem skip silencioso)
        run: python3 -c "import cv2, numpy, requests, onnxruntime, supervision; print('stack ML completa OK')"

      - name: Run ai-service unit tests
        run: python3 -m unittest discover -s services/ai-service-python/tests -t services/ai-service-python -v

  pnpm-verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  rtsp-e2e:
    name: e2e pipeline RTSP (fonte sintética)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pré-baixa a imagem MediaMTX de teste
        run: docker pull bluenviron/mediamtx:1-ffmpeg

      # Exercita o caminho REAL streaming→gravação contra uma fonte RTSP sintética.
      # DRAC_E2E_REQUIRED=1: se a fixture/config falhar, o teste FALHA (não pula
      # calado = falso-verde). A fixture usa containers/rede/portas próprios; NÃO
      # toca nenhum MediaMTX de produção. (item 0.3 do docs/PLANO-EVOLUCAO-DRAC.md)
      - name: e2e RTSP (obrigatório — falha se o pipeline não gravar)
        run: DRAC_E2E_REQUIRED=1 bash scripts/e2e-rtsp-fixture.sh run

  rbac-e2e:
    name: e2e RBAC (Postgres real)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pré-baixa a imagem Postgres de teste
        run: docker pull postgres:16-alpine

      # A matriz de acesso do `pnpm verify` roda contra um Prisma FAKE — ela não
      # enxerga `select:`, constraint de banco nem query com `where` não modelado.
      # Aqui o MESMO gate de autorização é exercitado contra Postgres real, com as
      # 40 migrations aplicadas. Vazar câmera entre clientes é o incidente mais
      # caro deste produto; é o teste que não pode faltar.
      # DRAC_E2E_REQUIRED=1: sem banco o teste FALHA em vez de pular calado.
      - name: e2e RBAC (obrigatório — falha se o gate não for verificado)
        run: DRAC_E2E_REQUIRED=1 bash scripts/e2e-postgres-fixture.sh run

  docker-build:
    name: docker build api web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API image
        run: docker build -f apps/api/Dockerfile .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile --build-arg VITE_API_URL= .

  android-build:
    name: android release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      # O cache Gradle só pode ser calculado DEPOIS do prebuild: antes dele não
      # existe gradle-wrapper.properties e setup-java encerra o job em vermelho.
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Build release bundle
        working-directory: apps/mobile/android
        run: ./gradlew bundleRelease --no-daemon --console=plain

      - name: Reject unsafe merged permissions
        run: |
          if grep -R -E 'SYSTEM_ALERT_WINDOW|WRITE_EXTERNAL_STORAGE' apps/mobile/android/app/build/intermediates/merged_manifests/release; then
            echo 'Unsafe Android permission found in release manifest' >&2
            exit 1
          fi

      - name: Preserve bundle for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-ci-not-for-distribution
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 7

  instalacao-limpa:
    name: instalacao limpa numa maquina virgem
    # Constroi todas as imagens do zero: caro. Roda sob demanda e nas tags de
    # release — que e quando o numero importa, porque e o que vai para o
    # cliente. NENHUMA instalacao de cliente deveria sair sem este verde.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar do zero e verificar
        run: bash scripts/teste-instalacao-limpa.sh --commit "${{ github.sha }}"
