# Temporary entrypoint until DNS allows issuance of the public certificate.
# Never publish the login/API over cleartext during certificate preparation.
server {
    listen 80;
    listen [::]:80;
    server_name dguardian.s2cam.com.br;
    access_log /var/log/nginx/dguardian-access.log combined;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ajustcam-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
    }

    location / {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 503 "Dguardian: preparando o acesso HTTPS.\n";
    }
}
