# Standalone installation: TLS terminates on the Dguardian VM, not Gateway.
map $http_upgrade $dguardian_connection_upgrade {
    default upgrade;
    '' close;
}

# Do not log query strings (media tokens) or Referer URLs containing them.
log_format dguardian_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name dguardian.s2cam.com.br;
    access_log /var/log/nginx/dguardian-access.log dguardian_safe;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ajustcam-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://dguardian.s2cam.com.br$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dguardian.s2cam.com.br;
    ssl_certificate /etc/letsencrypt/live/dguardian.s2cam.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dguardian.s2cam.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DguardianTLS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 512m;
    access_log /var/log/nginx/dguardian-access.log dguardian_safe;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # MediaMTX authentication is internal, never an external API endpoint.
    location ^~ /api/camera-stream/mediamtx-auth { return 404; }
    location = /central { return 404; }
    location /central/ { return 404; }

    # The web container already handles API, WHEP Location rewriting and HLS
    # cookies. Keep one route implementation; preserve HTTPS across both hops.
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dguardian_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }
    location ^~ /hls/ {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_redirect off;
        access_log off;
    }
}
