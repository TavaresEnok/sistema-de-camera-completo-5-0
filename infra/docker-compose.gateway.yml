# Overlay para instalações atrás da Gateway AjustCam compartilhada.
# O browser recebe credenciais TURN temporárias geradas pelo MediaMTX a partir
# do segredo REST do Coturn. O MediaMTX permanece alcançável pela Gateway na
# rede privada e, por isso, o TURN é necessário apenas no lado do cliente.
services:
  mediamtx:
    environment:
      - MTX_WEBRTCICESERVERS2_0_URL=${MEDIAMTX_TURN_URL:?MEDIAMTX_TURN_URL is required in gateway mode}
      - MTX_WEBRTCICESERVERS2_0_USERNAME=AUTH_SECRET
      - MTX_WEBRTCICESERVERS2_0_PASSWORD=${MEDIAMTX_TURN_SECRET:?MEDIAMTX_TURN_SECRET is required in gateway mode}
      - MTX_WEBRTCICESERVERS2_0_CLIENTONLY=true
      - MTX_WEBRTCICESERVERS2_1_URL=${MEDIAMTX_TURN_TCP_URL:-turn:turn.s2cam.com.br:3478?transport=tcp}
      - MTX_WEBRTCICESERVERS2_1_USERNAME=AUTH_SECRET
      - MTX_WEBRTCICESERVERS2_1_PASSWORD=${MEDIAMTX_TURN_SECRET:?MEDIAMTX_TURN_SECRET is required in gateway mode}
      - MTX_WEBRTCICESERVERS2_1_CLIENTONLY=true
      - MTX_WEBRTCICESERVERS2_2_URL=${MEDIAMTX_TURN_TLS_URL:-turns:turn.s2cam.com.br:5349?transport=tcp}
      - MTX_WEBRTCICESERVERS2_2_USERNAME=AUTH_SECRET
      - MTX_WEBRTCICESERVERS2_2_PASSWORD=${MEDIAMTX_TURN_SECRET:?MEDIAMTX_TURN_SECRET is required in gateway mode}
      - MTX_WEBRTCICESERVERS2_2_CLIENTONLY=true
