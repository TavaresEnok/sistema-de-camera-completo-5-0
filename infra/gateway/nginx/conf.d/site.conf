# A publicação requer remover o hostname s2cam.com.br de qualquer outro bloco
# existente na Gateway. Preserva os endpoints legados usados pelas instalações.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name s2cam.com.br;

    ssl_certificate /etc/letsencrypt/live/s2cam.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s2cam.com.br/privkey.pem;

    client_max_body_size 512m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 2100s;
    proxy_send_timeout 2100s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        root /var/www/certbot/s2cam-landing;
        try_files /index.html =503;
        expires -1;
    }

    location = /index.html {
        return 302 https://s2cam.com.br/;
    }

    # Official, provider-independent SGP integration documentation. Exact paths
    # keep legacy Central/API routes and private files outside the public root.
    location = /developers/sgp {
        alias /var/www/certbot/s2cam-landing/developers/sgp/index.html;
        default_type text/html;
        expires -1;
    }
    location = /developers/sgp/ {
        return 308 /developers/sgp;
    }
    location = /developers/sgp/openapi.json {
        alias /var/www/certbot/s2cam-landing/developers/sgp/openapi.json;
        default_type application/json;
        expires -1;
    }

    # Compatibilidade com APKs, instaladores e agentes emitidos anteriormente.
    # A navegação administrativa nova aponta para central.s2cam.com.br.
    location / {
        proxy_pass http://10.10.0.11:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
