# Compatibilidade temporária com equipamentos IBTelecom ainda configurados
# pelo IP público. Novas câmeras devem sempre usar o hostname do tenant.
vhost __defaultVhost__ {
    security { enabled on; allow publish all; deny play all; }
    chunk_size      4096;
    tcp_nodelay     on;
    min_latency     on;

    publish {
        normal_timeout   30000;
        firstpkt_timeout 20000;
    }

    forward {
        enabled     on;
        destination 10.10.0.20:1935;
    }
}
