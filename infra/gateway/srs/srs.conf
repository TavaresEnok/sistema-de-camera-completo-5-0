# S2Cam SRS — entrada RTMP pública compartilhada.
#
# O NAT entrega uma única porta 1935 para esta Gateway. O hostname do tcUrl
# seleciona explicitamente o tenant e app/stream são preservados até o
# MediaMTX da instalação, onde a chave é validada pela API do próprio tenant.
#
# 30 segundos é intencional: algumas câmeras móveis/legadas pausam pacotes por
# mais de 5 segundos. O padrão curto do SRS derrubava uma publicação saudável
# antes do limiar de stall do produto, causando reconexões em ciclo.
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level       warn;

http_api {
    enabled         on;
    listen          1985;
}

vhost vibe.cam.ajustconsulting.com.br {
    security { enabled on; allow publish all; deny play all; }
    chunk_size      4096;
    tcp_nodelay     on;
    min_latency     on;

    publish {
        normal_timeout   30000;
        firstpkt_timeout 20000;
    }

    forward {
        enabled     on;
        destination 168.194.15.218:1935;
    }
}

