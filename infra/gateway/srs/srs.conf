# Demo 03 receberá RTMP público pelo mesmo IP/porta compartilhados. O hostname
# no tcUrl seleciona esta rota; a stream key segue intacta para validação pela
# própria instalação em 10.10.0.22.
vhost demo-03.s2cam.com.br {
    security { enabled on; allow publish all; deny play all; }
    chunk_size      4096;
    tcp_nodelay     on;
    min_latency     on;

    publish {
        normal_timeout   30000;
        firstpkt_timeout 20000;
    }

    forward {
        enabled     on;
        destination 10.10.0.22:1935;
    }
}

